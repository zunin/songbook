[workspace]
members = ["crates/songbook-core", "crates/songbook-wasm"]
default-members = [".", "crates/songbook-core", "crates/songbook-wasm"]

[package]
name = "songbook"
version = "0.2.0"
edition = "2021"
description = "Convert ASCII tabs (chord-over-lyrics) to LaTeX songs-package format"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
songbook-core = { path = "crates/songbook-core" }

[profile.release]
lto = true
strip = true
