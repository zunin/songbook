[package]
name = "songbook-wasm"
version = "0.2.0"
edition = "2021"
description = "Browser-facing WASM session API over songbook-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
songbook-core = { path = "../songbook-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.100"
