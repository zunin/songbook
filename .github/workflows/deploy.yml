# deploy.yml — release/deployment pipeline.
#
# Board decisions encoded here:
#   * Tags only: deploys (Pages + Release) happen on push of a `v*` tag and
#     nothing else. Branch pushes never deploy — a tag is the explicit
#     "this ships" signal, so every deployment is tied to a versioned,
#     immutable commit and its own GitHub Release.
#   * Container-pinned build: the dist is compiled inside an image built from
#     .devcontainer/Dockerfile, so CI uses the exact pinned toolchain
#     (rustc, wasm-bindgen-cli, wasm-opt, node) that local builds use — no
#     runner toolchain drift, reproducible artifacts.
#   * Every release ships two files: songbook-dist-<version>.zip (servable
#     site) and songbook-source-<version>.tar.gz (git-archive source bundle).
name: deploy

on:
  push:
    tags:
      - "v*"

# Least-privilege default; deploy-pages and release elevate explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      # Guard: tag `v0.2.0` must equal the crate version in Cargo.toml —
      # otherwise the Release and its artifacts would carry a version the
      # code is not.
      - id: guard
        name: Guard — tag matches crate version
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "error: could not read package version from Cargo.toml" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "error: tag '${GITHUB_REF_NAME}' does not match crate version '${version}' (expected 'v${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the pinned toolchain image (.devcontainer/Dockerfile)
        run: docker build -t songbook-builder .devcontainer

      # Full build inside the pinned image: wasm + static app + source bundle
      # (works here because the runner checkout is clean, as source-bundle.sh
      # requires) + PDF engine assets (fetches upstream, verifies pinned
      # sha256s). Then hand the dist tree back to the runner user.
      - name: Build web/dist inside the pinned image
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace songbook-builder \
            bash -lc 'bash web/build.sh && bash web/build-pdf-assets.sh && chown -R 1000:1000 web/dist'

      # songbook-dist-<version>.zip: a top-level songbook-<version>/ folder
      # with the CONTENTS of web/dist/, so unpacking yields a servable folder.
      - name: Stage the dist zip
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          mkdir -p "stage/songbook-${VERSION}"
          cp -a web/dist/. "stage/songbook-${VERSION}/"
          ( cd stage && zip -qr "$GITHUB_WORKSPACE/songbook-dist-${VERSION}.zip" "songbook-${VERSION}" )

      - name: Upload dist zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: songbook-dist-${{ steps.guard.outputs.version }}
          path: songbook-dist-${{ steps.guard.outputs.version }}.zip
          if-no-files-found: error

      # The source bundle is produced by web/build.sh into web/dist (it is
      # part of the served tree); keep it aside for the Release job.
      - name: Upload source bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: songbook-source-${{ steps.guard.outputs.version }}
          path: web/dist/songbook-source-${{ steps.guard.outputs.version }}.tar.gz
          if-no-files-found: error

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Official Pages pattern: one deployment at a time; a newer deploy
    # cancels an in-flight one.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      # Jobs do not share workspaces: rebuild web/dist here from the exact
      # zip the Release ships, so the site serves the released bytes.
      - name: Download the dist zip artifact
        uses: actions/download-artifact@v8
        with:
          name: songbook-dist-${{ needs.build.outputs.version }}
          path: dist-zip

      - name: Unpack the dist zip into web/dist
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p web
          unzip -q "dist-zip/songbook-dist-${VERSION}.zip"
          mv "songbook-${VERSION}" web/dist

      - name: Configure Pages (enables Pages on first deploy)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the Release for the tag and upload assets
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: songbook-*-${{ needs.build.outputs.version }}
          merge-multiple: true

      - name: Create the Release and attach dist zip + source bundle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: songbook ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/songbook-dist-*.zip
            release/songbook-source-*.tar.gz
